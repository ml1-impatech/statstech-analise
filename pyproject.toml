[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "statstech-analise"
version = "0.1.0"
description = "Aplicação da biblioteca statstech ao ENEM 2023 e à cardiotocografia"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
